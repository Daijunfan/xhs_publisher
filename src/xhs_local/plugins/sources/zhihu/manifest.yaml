id: zhihu
kind: source
api_version: 1
version: 1
entrypoint: xhs_local.plugins.sources.zhihu.plugin:ZhihuSourcePlugin
content_types: [tech_news]
source_options:
  required: []
  additional_properties: false
  properties:
    lookback_hours: {type: number, minimum: 1}
    lookback_days: {type: integer, minimum: 1, maximum: 8}
    max_posts_per_target: {type: integer, minimum: 1}
    max_images_per_post: {type: integer, minimum: 0}
    request_timeout_seconds: {type: number, minimum: 1}
    max_concurrency: {type: integer, minimum: 1}
    include_comments: {type: boolean}
    comment_min_chars: {type: integer, minimum: 40}
target_options:
  required: []
  additional_properties: false
  properties:
    max_items: {type: integer, minimum: 1}
    include_comments: {type: boolean}
